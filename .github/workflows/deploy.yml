name: Deploy to GitHub Pages

on:
  push:
    branches: [main, arena/01a0cc4d-tamil-stoic-app]
  workflow_dispatch:

# Pages deployments need Pages write + OIDC token exchange.
# administration: write lets configure-pages register the Pages site
# (build type: GitHub Actions) on the very first run, if the plan allows.
permissions:
  contents: read
  pages: write
  id-token: write
  administration: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gather site files
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r css js data _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
