name: Deploy to GitHub Pages

on:
  # The configured github-pages environment only permits the default branch.
  # Keep feature-branch pushes green and deploy the public site after merge.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # A manual dispatch can select another branch; skip rather than fail when
    # github-pages protection rules reject non-main deployments.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate content before publishing
        run: node scripts/test-content.mjs

      # The published site is the React app (app/), which mirrors the canonical
      # corpus and assets at build time. `npm run build` runs the sync + tsc +
      # vite build, so a broken mirror fails the deploy instead of shipping.
      - name: Install the app workspace
        run: npm ci
        working-directory: app

      - name: Build the reader
        run: npm run build
        working-directory: app

      - name: Verify the built site (couplets, PWA contract, axe)
        run: npm test
        working-directory: app

      - name: Gather site files
        run: |
          mkdir -p _site
          cp -r app/dist/. _site/
          cp LICENSE THIRD_PARTY_NOTICES.md _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
