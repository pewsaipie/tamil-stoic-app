name: Content integrity

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all Kurals and correction regressions
        run: node scripts/test-content.mjs
