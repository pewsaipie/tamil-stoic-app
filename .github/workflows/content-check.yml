name: Content integrity

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate all Kurals and correction regressions
        run: node scripts/test-content.mjs
      - name: Validate open-source attributions and license packaging
        run: node scripts/test-credits.mjs

      # Presentation-layer gates from the UI/UX proposal (docs/ui-ux-proposal.md).
      # The contrast suite is dependency-free; the rest need jsdom (+ axe-core).
      - name: Colour-contrast regression (WCAG AA token pairs)
        run: node scripts/test-contrast.mjs
      - name: Service worker offline/update contract
        run: node scripts/test-service-worker.mjs
      - name: Install DOM test dependencies
        run: npm install --no-save jsdom axe-core
      - name: Reader behaviour smoke tests
        run: |
          node scripts/test-app.mjs
          node scripts/test-chapter-filter.mjs
          node scripts/test-companion-features.mjs
          node scripts/test-speech.mjs
      - name: axe-core accessibility scan
        run: node scripts/test-a11y.mjs

  # The published reader is the React app (app/). This job proves the mirror of
  # the canonical corpus is in step, the couplet contract holds, the speech
  # personas still behave, axe finds nothing, and the built PWA precaches the
  # whole library.
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install the app workspace
        run: npm ci
      - name: Typecheck, corpus mirror, tokens, couplets, speech, render + axe, build, PWA contract
        run: npm test
