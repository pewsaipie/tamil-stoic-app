<svg xmlns="http://www.w3.org/2000/svg" width="640" height="900" viewBox="0 0 640 900">
  <defs>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#173f32"/>
      <stop offset="0.28" stop-color="#4f8069"/>
      <stop offset="0.52" stop-color="#8aa586"/>
      <stop offset="0.72" stop-color="#456e5b"/>
      <stop offset="1" stop-color="#102e27"/>
    </linearGradient>
    <linearGradient id="young" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a6b992"/>
      <stop offset="0.5" stop-color="#65866c"/>
      <stop offset="1" stop-color="#2a5141"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9b982"/>
      <stop offset="1" stop-color="#3e674d"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="7" dy="11" stdDeviation="8" flood-color="#101019" flood-opacity="0.45"/>
    </filter>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2" seed="17" result="n"/>
      <feComposite in="n" in2="SourceGraphic" operator="in" result="texture"/>
      <feBlend in="SourceGraphic" in2="texture" mode="soft-light"/>
    </filter>
  </defs>
  <rect width="640" height="900" fill="#25213d"/>
  <g filter="url(#shadow)">
    <g filter="url(#grain)" stroke-linejoin="round">
      <!-- Euphorbia antiquorum: segmented, angled succulent stems, not a cactus. -->
      <path d="M278 844 L250 673 L267 520 L244 373 L266 223 L252 96 L293 83 L313 225 L292 377 L315 522 L296 678 L326 837 Z" fill="url(#stem)" stroke="#183c31" stroke-width="4"/>
      <path d="M268 524 L172 453 L134 339 L99 278 L125 253 L166 326 L203 423 L289 482 Z" fill="url(#stem)" stroke="#183c31" stroke-width="4"/>
      <path d="M283 382 L369 310 L404 202 L446 140 L471 163 L432 224 L400 337 L305 420 Z" fill="url(#stem)" stroke="#183c31" stroke-width="4"/>
      <path d="M263 674 L173 625 L123 549 L81 512 L102 482 L153 521 L202 588 L285 628 Z" fill="url(#stem)" stroke="#183c31" stroke-width="4"/>
      <path d="M294 679 L391 624 L430 538 L475 487 L498 514 L458 561 L419 655 L311 718 Z" fill="url(#stem)" stroke="#183c31" stroke-width="4"/>
      <path d="M257 249 L199 202 L176 137 L196 119 L224 177 L275 213 Z" fill="url(#young)" stroke="#285142" stroke-width="3"/>
      <path d="M394 222 L345 172 L337 103 L364 94 L374 151 L416 195 Z" fill="url(#young)" stroke="#285142" stroke-width="3"/>

      <!-- Ridge highlights and waxy surface striations. -->
      <g fill="none" stroke-linecap="round">
        <path d="M278 817 L273 678 L289 523 L270 374 L289 226 L275 107" stroke="#b3c39b" stroke-opacity="0.45" stroke-width="4"/>
        <path d="M300 820 L277 677 L300 522 L278 377 L300 229" stroke="#0b2c25" stroke-opacity="0.55" stroke-width="5"/>
        <path d="M275 500 L186 438 L151 333 L117 275" stroke="#a8bd96" stroke-opacity="0.38" stroke-width="4"/>
        <path d="M298 396 L383 323 L418 215 L455 158" stroke="#b3c39b" stroke-opacity="0.42" stroke-width="4"/>
        <path d="M270 651 L187 604 L140 534 L98 500" stroke="#b3c39b" stroke-opacity="0.36" stroke-width="4"/>
        <path d="M311 691 L404 638 L444 548 L484 505" stroke="#b3c39b" stroke-opacity="0.38" stroke-width="4"/>
      </g>

      <!-- Small paired thorns along the ridges. -->
      <g fill="#c2b994" stroke="#5c624c" stroke-width="1.2">
        <path d="M252 706 l-18 -5 l16 17 Z M302 711 l18 -7 l-15 19 Z"/>
        <path d="M254 610 l-17 -6 l15 18 Z M303 611 l17 -7 l-14 19 Z"/>
        <path d="M263 486 l-17 -8 l14 20 Z M303 465 l18 -5 l-16 17 Z"/>
        <path d="M250 350 l-16 -7 l14 18 Z M298 339 l17 -6 l-14 18 Z"/>
        <path d="M260 205 l-15 -6 l13 17 Z M299 185 l15 -5 l-13 16 Z"/>
        <path d="M172 439 l-17 2 l13 12 Z M145 350 l-16 0 l13 13 Z"/>
        <path d="M385 326 l17 1 l-14 12 Z M416 240 l16 0 l-13 12 Z"/>
        <path d="M186 599 l-17 1 l13 13 Z M133 535 l-16 0 l13 12 Z"/>
        <path d="M407 632 l17 1 l-14 12 Z M448 550 l16 0 l-13 12 Z"/>
      </g>

      <!-- Sparse small leaves; no showy invented flowers. -->
      <g fill="url(#leaf)" stroke="#3c654e" stroke-width="2">
        <path d="M259 103 C224 77 225 48 266 73 C283 83 280 99 259 103 Z"/>
        <path d="M282 91 C303 54 332 58 310 91 C301 105 289 105 282 91 Z"/>
        <path d="M104 270 C67 256 62 229 101 241 C120 247 122 261 104 270 Z"/>
        <path d="M454 151 C469 113 499 116 481 150 C472 166 459 166 454 151 Z"/>
        <path d="M91 494 C53 486 45 460 84 466 C105 469 109 483 91 494 Z"/>
        <path d="M481 501 C505 469 532 479 505 505 C492 517 481 514 481 501 Z"/>
        <path d="M192 127 C165 99 175 78 202 105 C214 118 208 130 192 127 Z"/>
        <path d="M350 105 C333 72 350 56 367 88 C375 103 365 113 350 105 Z"/>
      </g>
    </g>
  </g>
</svg>
