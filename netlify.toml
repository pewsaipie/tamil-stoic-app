[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Friendly public API URLs. The function remains directly accessible at
# /.netlify/functions/quotes for Netlify's local tooling.
[[redirects]]
  from = "/api/quotes"
  to = "/.netlify/functions/quotes"
  status = 200
  force = true

[[redirects]]
  from = "/api/quotes/*"
  to = "/.netlify/functions/quotes?id=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

# Keep client-side section navigation working on direct visits.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
